<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 400px; margin: 0; padding: 0;
    font: 12px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1a1a1a; background: #fff;
  }
  .wrap { padding: 12px 12px 10px; }

  .head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c8c8c8; flex: none; }
  .dot.on { background: #1a7a3a; }
  .dot.off { background: #c0392b; }
  .site { font-weight: 600; font-size: 12.5px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .ver { color: #999; font-size: 10px; flex: none; }

  .offline {
    background: #fdf3f2; border: 1px solid #f0cdc9; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 10px; color: #a03030; font-size: 11.5px;
  }
  .offline code {
    font-family: ui-monospace, Consolas, monospace; background: #fff;
    padding: 1px 4px; border-radius: 3px; border: 1px solid #f0cdc9;
  }
  .hidden { display: none !important; }

  .page-btn {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid #b8cef0; background: #f6f9ff; border-radius: 7px;
    padding: 9px 11px; margin-bottom: 12px; font: inherit; color: #1a1a1a;
  }
  .page-btn:hover { background: #eef4ff; border-color: #8fb0e0; }
  .page-btn:active { background: #e4eeff; }
  .page-btn[disabled] { opacity: .45; cursor: default; }
  .page-btn.attn { border-color: #2a5aa8; background: #eaf1ff; box-shadow: 0 0 0 1px #2a5aa8 inset; }
  .pb-title { display: block; font-weight: 600; font-size: 12.5px; color: #2a5aa8; }
  .pb-sub { display: block; color: #6b7a90; font-size: 10.5px; margin-top: 2px; }

  .sec-title {
    display: flex; justify-content: space-between; align-items: baseline;
    color: #8a8a8a; font-size: 10.5px; letter-spacing: .3px;
    margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #eee;
  }

  .list { display: flex; flex-direction: column; gap: 4px; max-height: 210px; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px;
    border: 1px solid #e8e8e8; border-radius: 6px; background: #fff;
  }
  .row:hover { border-color: #c8d8f0; background: #fafcff; }
  .row.empty {
    border-style: dashed; color: #999; display: block; padding: 14px 10px;
    text-align: center; font-size: 11px; line-height: 1.7; white-space: pre-line;
  }
  .badge {
    flex: none; min-width: 44px; text-align: center; font-size: 10px;
    font-weight: 700; padding: 2px 5px; border-radius: 4px;
    background: #eef2f8; color: #4a5a72;
  }
  .badge.hd { background: #e6f4ea; color: #1a7a3a; }
  .seg { flex: none; font-size: 10.5px; color: #6b7a90; font-variant-numeric: tabular-nums; }
  .seg b { color: #1a1a1a; font-weight: 600; }
  .host { flex: 1; font-size: 10px; color: #aaa; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .dl {
    flex: none; border: none; background: #2a5aa8; color: #fff; cursor: pointer;
    width: 24px; height: 24px; border-radius: 5px; font-size: 13px; line-height: 1;
  }
  .dl:hover { background: #1f4785; }
  .dl[disabled] { background: #c8c8c8; cursor: default; }

  .jobs { margin-top: 12px; }
  .job { border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; font-size: 11px; }
  .job-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .job-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-pct { color: #6b7a90; font-variant-numeric: tabular-nums; flex: none; }
  .bar { height: 3px; background: #eee; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2a5aa8; width: 0; transition: width .4s; }
  .job.ok .bar i { background: #1a7a3a; }
  .job.err .bar i { background: #c0392b; }
  .job-msg { color: #8a8a8a; margin-top: 4px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .job-msg.err { color: #a03030; }
  .job-msg a { color: #2a5aa8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="dot" id="dot"></span>
    <span class="site" id="site">读取页面…</span>
    <span class="ver" id="ver"></span>
  </div>

  <div class="offline hidden" id="offline">
    本地服务没开，插件没法下载。双击仓库里的 <code>server.bat</code>，窗口留着别关。
  </div>

  <button class="page-btn" id="pageBtn">
    <span class="pb-title">下载这个页面</span>
    <span class="pb-sub">交给 yt-dlp 解析。B 站、YouTube 这类页面里没有 m3u8，走这条</span>
  </button>

  <div class="sec-title">
    <span>页面上抓到的流</span>
    <span id="count"></span>
  </div>
  <div class="list" id="list">
    <div class="row empty">正在扫描…</div>
  </div>

  <div class="jobs" id="jobs"></div>
</div>
<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>stream-grabber</title>
<style>
  :root { --line:#e6e8ec; --muted:#7a8494; --blue:#2a5aa8; --green:#1a7a3a; --red:#c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 28px 60px; font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif;
         color: #1b1d21; background: #f7f8fa; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
          margin-bottom: 16px; }
  .card h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: #33383f;
             display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .grid { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; }
  label { color: #4a5260; font-size: 12px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 6px 8px; border: 1px solid #d8dde5; border-radius: 6px;
    font: inherit; background: #fff; }
  input:focus, select:focus { outline: none; border-color: var(--blue); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input[type=text] { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #d8dde5;
           background: #fff; padding: 6px 12px; color: #2b3038; }
  button:hover { border-color: #b9c4d4; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: #1f4785; }
  button[disabled] { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .job { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .job-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .bar { height: 4px; background: #eef0f4; border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .35s; }
  .job.done .bar > i { background: var(--green); }
  .job.err .bar > i { background: var(--red); }
  .job-msg { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; }
  .job.err .job-msg { color: #a03030; }
  .acts { display: flex; gap: 6px; margin-top: 8px; }
  .acts button { padding: 3px 10px; font-size: 11.5px; }
  .empty { color: #9aa3b0; font-size: 12px; padding: 8px 2px; }
  .modal { position: fixed; inset: 0; background: rgba(20,24,30,.35); display: none;
           align-items: center; justify-content: center; }
  .modal.on { display: flex; }
  .modal .box { background: #fff; border-radius: 10px; width: 520px; max-height: 70vh;
                display: flex; flex-direction: column; overflow: hidden; }
  .modal .box header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .modal .box .list { overflow: auto; padding: 8px 6px; flex: 1; }
  .modal .box .list div { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .modal .box .list div:hover { background: #f2f6fc; }
  .modal .box footer { padding: 10px 16px; border-top: 1px solid var(--line);
                       display: flex; justify-content: space-between; gap: 10px; }
  .path { color: var(--muted); font-size: 11.5px; word-break: break-all; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
          background: #eef2f8; color: #4a5a72; margin-left: 6px; }
</style>
</head>
<body>
  <h1>stream-grabber</h1>
  <div class="sub" id="status">连接本地服务…</div>

  <div class="card" id="prepareCard">
    <h2>新建下载 <span id="srcHint"></span></h2>
    <div class="grid">
      <label>地址</label>
      <input type="text" id="url" placeholder="页面地址或 m3u8 直链">
      <label>文件名</label>
      <input type="text" id="name" placeholder="不带扩展名">
      <label>保存到</label>
      <div class="row">
        <input type="text" id="outDir" placeholder="选择目录">
        <button id="browse">浏览</button>
      </div>
      <label>档位</label>
      <select id="variant"><option value="">最高可用</option></select>
      <label>并发</label>
      <input type="number" id="threads" min="1" max="32" value="16">
      <label>下载路径</label>
      <select id="routeMode">
        <option value="auto">自动（直连优先，不通换代理）</option>
        <option value="direct">只用直连</option>
        <option value="proxy">只用代理</option>
      </select>
      <label>取流方式</label>
      <select id="fetchMode">
        <option value="server">服务端（快，推荐）</option>
        <option value="browser">浏览器取流（服务端被拒时用）</option>
      </select>
    </div>
    <div class="acts">
      <button class="primary" id="start">开始下载</button>
      <button id="probe">探测这条地址</button>
    </div>
    <div class="hint" id="probeOut"></div>
  </div>

  <div class="card">
    <h2>任务 <span id="jobCount"></span></h2>
    <div id="jobs"><div class="empty">还没有任务</div></div>
  </div>

  <div class="card">
    <h2>设置 <span>保存后对新任务生效</span></h2>
    <div class="grid">
      <label>默认目录</label>
      <div class="row">
        <input type="text" id="sOutDir">
        <button id="sBrowse">浏览</button>
      </div>
      <label>默认并发</label>
      <input type="number" id="sThreads" min="1" max="32">
      <label>默认路径</label>
      <select id="sRoute">
        <option value="auto">自动</option>
        <option value="direct">只用直连</option>
        <option value="proxy">只用代理</option>
      </select>
      <label>代理地址</label>
      <input type="text" id="sProxy" placeholder="auto 或 http://127.0.0.1:7897">
    </div>
    <div class="acts"><button class="primary" id="saveSet">保存设置</button></div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <header>选择目录</header>
      <div class="list" id="dirList"></div>
      <footer>
        <span class="path" id="dirPath"></span>
        <span>
          <button id="dirUp">上一级</button>
          <button class="primary" id="dirPick">用这个目录</button>
        </span>
      </footer>
    </div>
  </div>

<script src="dashboard.js"></script>
</body>
</html>
